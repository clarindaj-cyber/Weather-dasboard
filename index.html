
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌦️ Weather Dashboard</h1>
        <p>Check the weather in your city</p>
    </header>

    <main>

        <!-- City Search Section -->
        <section class="search-section">
            <input type="text" id="cityInput"
                   placeholder="Enter city name">

            <button id="searchBtn">Search</button>
        </section>

        <!-- Current Weather Section -->
        <section class="weather-card">

            <h2 id="cityName">Coimbatore</h2>

            <p id="dateTime" class="date-time">--</p>

           <div class="weather-icon" id="weatherIcon">☀️</div>

            <h1 id="temperature">29°C</h1>

            <p id="condition">Sunny</p>

        </section>

        <!-- Weather Details -->
        <section class="details">

            <div class="detail-card">
                <h3>💧 Humidity</h3>
                <p id="humidity">65%</p>
            </div>

            <div class="detail-card">
                <h3>🌬️ Wind Speed</h3>
                <p id="wind">12 km/h</p>
            </div>

            <div class="detail-card">
                <h3>🌡️ Feels Like</h3>
                <p id="feelsLike">32°C</p>
            </div>

        </section>

        <p id="message"></p>

    </main>

    <footer>
        <p>Weather Information Dashboard | Web Technology Microproject</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
